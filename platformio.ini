; TRMNL 7.5" DIY Kit: XIAO ESP32-S3 + Waveshare 7.5" V2 (800x480, 1 бит).
;
; Плата seeed_xiao_esp32s3 в стандартной раскладке отдаёт 4 МБ flash без PSRAM,
; хотя на модуле 8 МБ и того и другого. Раскладку и PSRAM включаем явно, иначе
; буфер кадра (800*480/8 = 48 КБ) и веб-интерфейс ужимаются без нужды.

[platformio]
src_dir = firmware/src
data_dir = firmware/data
test_dir = firmware/test
; Без этого `pio run` из README (без -e) собирает все объявленные env сразу,
; включая env:native — а тот пытается собрать firmware/src целиком под хост,
; где Preferences/WiFi/GxEPD2 не существуют, и падает.
default_envs = xiao-esp32s3

[env:xiao-esp32s3]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32s3
framework = arduino

board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_build.filesystem = littlefs

; Набор корневых сертификатов для проверки HTTPS (docs/decisions.md, п.9).
; Зашивается прямо в прошивку через objcopy, а не читается из LittleFS: это
; тот же образ, что видит каждый инстанс устройства, и он не должен зависеть
; от того, что залито в файловую систему настройки.
board_build.embed_files = firmware/certs/x509_crt_bundle.bin

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1     ; лог в USB-порт без внешнего преобразователя
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags = -std=gnu++11

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    zinggjm/GxEPD2@^1.6.2           ; драйвер панели; у 7.5" V2 есть частичное обновление
    bblanchon/ArduinoJson@^7.2.0
    ESP32Async/ESPAsyncWebServer@^3.6.0

; Тесты логики (слоты, раскладка, разбор конфигурации) гоняем на хосте: гонять
; их на устройстве ради арифметики — минуты вместо секунд.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -DNATIVE_BUILD
lib_deps = bblanchon/ArduinoJson@^7.2.0
test_framework = unity

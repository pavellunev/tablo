<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>tablo — setup</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3ef;
    --card: #ffffff;
    --text: #1a1a17;
    --muted: #6b6a64;
    --border: #dcdad2;
    --accent: #2c2c28;
    --accent-text: #ffffff;
    --danger: #9c3b2e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }
  header {
    padding: 20px 16px 8px;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 14px;
  }
  main {
    padding: 8px 16px 96px;
    max-width: 480px;
    margin: 0 auto;
  }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  section h2 {
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row .label {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .meta {
    color: var(--muted);
    font-size: 13px;
    flex-shrink: 0;
  }
  button {
    font: inherit;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-text);
    padding: 12px 16px;
    min-height: 44px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--accent);
  }
  button.small {
    padding: 6px 10px;
    min-height: 32px;
    font-size: 13px;
  }
  button.danger {
    background: transparent;
    border-color: var(--danger);
    color: var(--danger);
  }
  button:disabled { opacity: 0.4; cursor: default; }
  button:active { opacity: 0.75; }
  button.full { width: 100%; margin-top: 4px; }
  input, select {
    font: inherit;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    margin-top: 6px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .actions button { flex: 1; }
  .empty {
    color: var(--muted);
    font-size: 14px;
    padding: 8px 0;
  }
  .connector-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .connector-card .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 8px;
  }
  .checkbox-row input { width: auto; margin-top: 2px; }
  .checkbox-row.inline { align-items: center; margin: 0; }
  .checkbox-row.inline input { margin-top: 0; }
  .warning {
    color: var(--danger);
    font-size: 12px;
  }
  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    max-width: 480px;
    margin: 0 auto;
  }
  footer button { flex: 1; }
  #status {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 72px;
    max-width: 448px;
    margin: 0 auto;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    min-height: 16px;
  }

  /* Экраны */
  .canvas-wrap { margin-bottom: 12px; }
  #preview-canvas {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab-btn {
    flex: 1;
    min-width: 90px;
    padding: 8px 10px;
    min-height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 13px;
  }
  .tab-btn.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .dash-row { margin-top: 16px; }
  .dash-row h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .widget-list { display: flex; flex-direction: column; gap: 10px; }
  .widget-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .widget-item .row { border-bottom: none; padding: 0 0 6px; }
  .widget-item-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
  .widget-item-move { display: flex; gap: 6px; flex-wrap: wrap; }
  .widget-item-move button { flex: 1; min-width: 60px; }
  .source-status { margin: 6px 0 0; font-size: 13px; }
  .source-status.ok { color: var(--muted); }
  .source-status.missing { color: var(--danger); cursor: pointer; text-decoration: underline; }
  .palette { border: 1px dashed var(--border); border-radius: 10px; padding: 10px; margin-top: 8px; }
  .add-form { border: 1px dashed var(--border); border-radius: 8px; padding: 10px; margin-top: 8px; }
  .add-form select, .add-form input { margin-top: 6px; }

  /* Источники */
  .source-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .source-card h3 { margin: 0 0 4px; font-size: 15px; }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  details { margin-top: 8px; }
  details summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 6px 0; }
</style>
</head>
<body>
<header>
  <h1>tablo</h1>
  <p data-i18n="header.sub">Device setup</p>
</header>

<main>

  <section id="wifi-section">
    <h2 data-i18n="section.network">Network</h2>
    <div id="saved-networks"><p class="empty" data-i18n="net.none">No saved networks</p></div>
    <button type="button" class="secondary full" id="scan-btn" data-i18n="net.scan">Scan networks</button>
    <div id="scan-list"></div>
    <div id="add-network-form" hidden>
      <label id="add-ssid-label"></label>
      <input id="add-password" type="password" placeholder="Network password" data-i18n-placeholder="net.password.ph">
      <div class="actions">
        <button type="button" id="add-network-confirm" data-i18n="btn.add">Add</button>
        <button type="button" class="secondary" id="add-network-cancel" data-i18n="btn.cancel">Cancel</button>
      </div>
    </div>
  </section>

  <section id="dashboards-section">
    <h2 data-i18n="section.screens">Screens</h2>
    <div class="canvas-wrap"><canvas id="preview-canvas" width="800" height="480"></canvas></div>
    <div id="dashboards-box"><p class="empty" data-i18n="loading">Loading…</p></div>
  </section>

  <section id="sources-section">
    <h2 data-i18n="section.sources">Sources</h2>
    <div id="sources-list"></div>
    <details>
      <summary data-i18n="sources.more">Advanced</summary>
      <div id="custom-connectors"></div>
      <button type="button" class="secondary full" id="add-custom-connector" data-i18n="sources.addCustom">+ Add source</button>
    </details>
  </section>

  <section id="device-section">
    <h2 data-i18n="section.device">Device</h2>
    <label><span data-i18n="device.name">Device name</span>
      <input id="device-name" type="text" placeholder="tablo-setup">
    </label>
    <p class="empty" id="device-name-hint"></p>
    <label><span data-i18n="device.lang">Language</span>
      <select id="lang">
        <option value="en">English</option>
        <option value="ru">&#1056;&#1091;&#1089;&#1089;&#1082;&#1080;&#1081;</option>
      </select>
    </label>
  </section>

</main>

<p id="status"></p>
<footer>
  <button type="button" id="save-btn" data-i18n="save" disabled>Save</button>
  <button type="button" class="secondary" id="reboot-btn" data-i18n="reboot">Reboot</button>
</footer>

// Подстановка {0}, {1}; нет ключа в текущем языке — en, нет и там — сам ключ.
function t(key) {
  var s = (I18N[state.lang] || {})[key];
  if (s === undefined) s = I18N.en[key];
  if (s === undefined) s = key;
  var args = arguments;
  return s.replace(/\{(\d+)\}/g, function (m, i) {
    return args[Number(i) + 1] !== undefined ? args[Number(i) + 1] : m;
  });
}

// Известные слоты — то, что реально умеет показывать кадр устройства.
// Используются и в мастере добавления показателя (metric), и в ручной
// привязке датчиков/своих источников.
// Подписи — t('slot.' + slot) в момент рендера, чтобы смена языка их обновляла.
var SLOTS = [
  'btc', 'usd_rub', 'eur_rub', 'co2', 'tvoc', 'weather.temp',
  'limit.claude.5h', 'limit.claude.week', 'limit.codex', 'mail.unread'
];

// Заводские коннекторы: id/kind фиксированы прошивкой (config.cpp,
// defaults()) — карточки источников привязаны к ним по id, а не создаются
// произвольно. Если коннектора нет в ответе устройства (прошивка ещё не
// умеет его, либо владелец сам удалил из NVS раньше) — страница создаёт
// заглушку сама, и он появится при первом же сохранении формы.
var FACTORY_STUBS = [
  { id: 'claude', kind: 'anthropic' }, { id: 'codex', kind: 'codex' },
  { id: 'mail', kind: 'imap' }, { id: 'home', kind: 'homeassistant' },
  { id: 'btc', kind: 'http' }, { id: 'btc_history', kind: 'http' }, { id: 'fiat', kind: 'http' },
  { id: 'weather', kind: 'weather' }, { id: 'geocode', kind: 'geocode' }
];
var FACTORY_IDS = {};
FACTORY_STUBS.forEach(function (s) { FACTORY_IDS[s.id] = true; });
function isFactoryId(id) { return !!FACTORY_IDS[id]; }

// Карточки источников на странице: к какому(им) коннектору(ам) привязана
// карточка, по какому слоту показывать «обновлено N мин назад», и всегда ли
// она считается настроенной (Курсы и Погода — публичные API без ключа).
var SOURCE_CARDS = [
  { key: 'claude', titleKey: 'card.claude.title', connIds: ['claude'], firstSlot: 'limit.claude.5h', always: false },
  { key: 'codex', titleKey: 'card.codex.title', connIds: ['codex'], firstSlot: 'limit.codex', always: false },
  { key: 'mail', titleKey: 'card.mail.title', connIds: ['mail'], firstSlot: 'mail.unread', always: false },
  { key: 'home', titleKey: 'card.home.title', connIds: ['home'], firstSlot: 'co2', always: false },
  { key: 'rates', titleKey: 'card.rates.title', connIds: ['btc', 'btc_history', 'fiat'], firstSlot: 'btc', always: true },
  { key: 'weather', titleKey: 'card.weather.title', connIds: ['weather', 'geocode'], firstSlot: 'weather.temp', always: true }
];

var state = {
  lang: 'en',     // язык страницы и панели; приходит из /api/config, по умолчанию en
  scanResults: null,
  loaded: false,  // /api/config прочитан успешно — только тогда «Сохранить» активна
  device_name: '', timezone_minutes: 0, city: '', city_resolved: '', city_lat: 0, city_lon: 0,
  networks: [], connectors: [], connectorOrig: {},
  dashboardsSupported: false, dashboards: [], activeDashboard: 0, currentTab: 0,
  paletteRow: null, paletteSubType: null, addSensorOpen: false,
  widgetsCatalog: [], widgetsByType: {},
  status: null
};
var pendingSsid = null;
var pendingSecure = false;

function el(id) { return document.getElementById(id); }

function setStatus(text) {
  el('status').textContent = text;
}

function signalBars(rssi) {
  if (rssi >= -60) return '▂▄▆█';
  if (rssi >= -70) return '▂▄▆';
  if (rssi >= -80) return '▂▄';
  return '▂';
}

function fetchJSON(url, options) {
  return fetch(url, options).then(function (r) {
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function escapeAttr(s) { return escapeHtml(s); }

function conn(id) {
  return state.connectors.find(function (c) { return c.id === id; });
}

// Заводской коннектор без ответа устройства — не повод падать: страница
// заводит его заглушкой (пустые поля, ничего не «задано»), а реальным он
// станет при первом сохранении формы, потому что payload шлёт ВСЕ коннекторы.
function ensureFactoryConnectors() {
  FACTORY_STUBS.forEach(function (stub) {
    if (conn(stub.id)) return;
    state.connectors.push({
      id: stub.id, kind: stub.kind, url: '', interval: 300,
      token: '', token_set: false, refresh_token: '', refresh_token_set: false,
      username: '', username_set: false, insecure: false, map: []
    });
  });
}

function tokenPlaceholder(isSet) {
  return isSet ? t('token.set') : t('token.unset');
}

function sensorRole(slot) {
  if (slot === 'co2') return 'CO₂';
  if (slot === 'tvoc') return 'TVOC';
  return slot;
}

// ── карточки источников: состояние и правило «какая карточка нужна слоту» ──

function sourceCardByKey(key) {
  for (var i = 0; i < SOURCE_CARDS.length; i++) {
    if (SOURCE_CARDS[i].key === key) return SOURCE_CARDS[i];
  }
  return null;
}
function cardTitleByKey(key) {
  var c = sourceCardByKey(key);
  return c ? t(c.titleKey) : key;
}

// Правило из плана: limit.claude*→Claude, limit.codex*→Codex, mail.*→Почта,
// co2/tvoc→Умный дом, btc/usd_rub/eur_rub→Курсы, weather.*→Погода. Слот вне
// этого списка (свой источник) требования к карточке не несёт.
function slotSourceCard(slot) {
  if (slot.indexOf('limit.claude') === 0) return 'claude';
  if (slot.indexOf('limit.codex') === 0) return 'codex';
  if (slot.indexOf('mail.') === 0) return 'mail';
  if (slot === 'co2' || slot === 'tvoc') return 'home';
  if (slot === 'btc' || slot === 'usd_rub' || slot === 'eur_rub') return 'rates';
  if (slot.indexOf('weather.') === 0) return 'weather';
  return null;
}

// «Настроен» = у коннектора карточки задан token (для Курсов и Погоды —
// всегда, это публичные API без ключа).
function isCardConfigured(key) {
  var card = sourceCardByKey(key);
  if (!card) return true;
  if (card.always) return true;
  var c = conn(card.connIds[0]);
  return !!(c && c.token_set);
}

function slotInfo(name) {
  return (state.status && state.status.slots && state.status.slots[name]) || null;
}

// Слот `<id>.status` с непустым error — явная ошибка источника, показываем
// её текстом; иначе — «обновлено N мин назад» по первому слоту источника,
// либо «данных ещё нет», если слот ни разу не наполнялся.
function computeSourceCardStatus(card) {
  for (var i = 0; i < card.connIds.length; i++) {
    var s = slotInfo(card.connIds[i] + '.status');
    if (s && s.error) return { error: true, text: s.error };
  }
  var fs = slotInfo(card.firstSlot);
  if (!fs) return { error: false, text: t('status.none') };
  var mins = Math.max(0, Math.round((fs.age || 0) / 60));
  return { error: false, text: t('status.updated', mins) };
}

function statusLineHtml(key) {
  var card = sourceCardByKey(key);
  var st = computeSourceCardStatus(card);
  var cls = st.error ? 'warning' : 'meta';
  return '<p class="' + cls + '" id="status-line-' + key + '">' + escapeHtml(st.text) + '</p>';
}

// Периодическое обновление (каждые 10с) — точечно, без перестройки DOM:
// иначе набираемый текст в полях формы терял бы фокус и курсор.
function updateStatusLines() {
  SOURCE_CARDS.forEach(function (card) {
    var lineEl = document.getElementById('status-line-' + card.key);
    if (!lineEl) return;
    var st = computeSourceCardStatus(card);
    lineEl.textContent = st.text;
    lineEl.className = st.error ? 'warning' : 'meta';
  });
}

// «Адрес изменился — токен не наследуется» (config.cpp, target_unchanged):
// подсказка обновляется точечно по каждому нажатию клавиши, без перерисовки
// всей карточки.
function updateChangedHint(id) {
  var hintEl = document.getElementById('hint-changed-' + id);
  if (!hintEl) return;
  var c = conn(id);
  var orig = state.connectorOrig[id];
  if (!c || !orig) { hintEl.hidden = true; return; }
  var changed = (c.url !== orig.url) || (c.insecure && !orig.insecure);
  hintEl.hidden = !changed;
}
function updateAllChangedHints() {
  state.connectors.forEach(function (c) { updateChangedHint(c.id); });
}

function cityHintText() {
  if (state.city && state.city !== state.city_resolved) {
    return t('hint.city.pending');
  } else if (state.city_lat || state.city_lon) {
    return t('hint.city.coords', state.city_lat.toFixed(4), state.city_lon.toFixed(4));
  }
  return '';
}

function updateCityHint() {
  var hintEl = document.getElementById('city-hint');
  if (!hintEl) return;
  hintEl.textContent = cityHintText();
}

function updateDeviceNameHint(name) {
  var hintEl = document.getElementById('device-name-hint');
  if (!hintEl) return;
  hintEl.textContent = t('hint.device.url', name || 'tablo-setup');
}

// ── Экраны: токены размеров, каталог виджетов, дашборды ──

function widgetPxWidth(size) {
  if (size === 'S') return 202;
  if (size === 'M') return 296;
  return 0;  // flex — без фиксированной ширины
}

// Варианты размера уже недоступные по min_width виджета не предлагаются.
function sizeOptionsHtml(minWidth, current) {
  var opts = [];
  if (minWidth <= 202) opts.push(['S', 'S (202 px)']);
  if (minWidth <= 296) opts.push(['M', 'M (296 px)']);
  opts.push(['flex', t('size.flex')]);
  return opts.map(function (o) {
    return '<option value="' + o[0] + '"' + (o[0] === current ? ' selected' : '') + '>' + o[1] + '</option>';
  }).join('');
}

function slotOptionsHtml(current) {
  var html = '<option value="">' + t('slot.placeholder') + '</option>';
  SLOTS.forEach(function (s) {
    html += '<option value="' + s + '"' + (s === current ? ' selected' : '') + '>' + escapeHtml(t('slot.' + s)) + '</option>';
  });
  return html;
}

// Заголовок типа виджета: свой перевод по type, иначе title из прошивки.
function typeTitle(type, spec) {
  if (I18N.en['widget.' + type] !== undefined) return t('widget.' + type);
  return (spec && spec.title) || type;
}

function widgetTitle(inst) {
  if ((inst.type === 'metric' || inst.type === 'text') && inst.label) return inst.label;
  return typeTitle(inst.type, state.widgetsByType[inst.type]);
}

// Слоты, которые требует виджет: у metric — единственный выбранный слот, у
// остальных — spec.slots из /api/widgets. text данных не требует вовсе.
function computeWidgetSourceStatus(inst, spec) {
  if (inst.type === 'text') return null;
  var slots;
  if (inst.type === 'metric') {
    slots = inst.slot ? [inst.slot] : [];
  } else {
    slots = (spec && spec.slots) || [];
  }
  if (slots.length === 0) return null;
  var missing = [];
  var seen = {};
  slots.forEach(function (s) {
    var card = slotSourceCard(s);
    if (!card || seen[card]) return;
    if (!isCardConfigured(card)) { seen[card] = true; missing.push(card); }
  });
  if (missing.length === 0) return { configured: true, text: t('wsrc.ok') };
  var titles = missing.map(function (k) { return cardTitleByKey(k); });
  return { configured: false, text: t('wsrc.need', titles.join(', ')), firstMissing: missing[0] };
}

function isInstanceConfigured(inst) {
  var spec = state.widgetsByType[inst.type];
  var status = computeWidgetSourceStatus(inst, spec);
  return !status || status.configured;
}

function currentDashboard() {
  if (!state.dashboardsSupported) return null;
  return state.dashboards[state.currentTab] || null;
}

function pushWidgetInstance(row, inst) {
  var dash = currentDashboard();
  if (!dash) return;
  dash.rows[row].push(inst);
}

function moveWidget(row, idx, dir) {
  var dash = currentDashboard();
  if (!dash) return;
  var arr = dash.rows[row];
  var j = dir === 'up' ? idx - 1 : idx + 1;
  if (j < 0 || j >= arr.length) return;
  var tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
}

function moveToOtherRow(row, idx) {
  var dash = currentDashboard();
  if (!dash) return;
  var other = row === 0 ? 1 : 0;
  var inst = dash.rows[row].splice(idx, 1)[0];
  if (inst) dash.rows[other].push(inst);
}

function removeWidget(row, idx) {
  var dash = currentDashboard();
  if (!dash) return;
  dash.rows[row].splice(idx, 1);
}

function renderRow(dash, rowIndex) {
  var row = dash.rows[rowIndex];
  var html = '<div class="widget-list">';
  row.forEach(function (inst, i) {
    var spec = state.widgetsByType[inst.type];
    var title = typeTitle(inst.type, spec);
    var minWidth = spec ? spec.min_width : 0;
    var status = computeWidgetSourceStatus(inst, spec);
    html += '<div class="widget-item">';
    html += '<div class="row"><span class="label">' + escapeHtml(title) + '</span>' +
      '<button type="button" class="small danger" data-remove-widget data-row="' + rowIndex + '" data-idx="' + i + '">✕</button></div>';
    html += '<div class="widget-item-controls">' +
      '<select data-widget-field="size" data-row="' + rowIndex + '" data-idx="' + i + '">' + sizeOptionsHtml(minWidth, inst.size) + '</select>' +
      '<label class="checkbox-row inline"><input type="checkbox" data-widget-field="divider" data-row="' + rowIndex + '" data-idx="' + i + '"' + (inst.divider ? ' checked' : '') + '><span>' + t('widget.divider') + '</span></label>' +
      '</div>';
    if (inst.type === 'metric') {
      html += '<div class="widget-item-controls">' +
        '<select data-widget-field="slot" data-row="' + rowIndex + '" data-idx="' + i + '">' + slotOptionsHtml(inst.slot) + '</select>' +
        '<input type="text" placeholder="' + t('widget.label.ph') + '" value="' + escapeAttr(inst.label) + '" data-widget-field="label" data-row="' + rowIndex + '" data-idx="' + i + '">' +
        '</div>';
    } else if (inst.type === 'text') {
      html += '<div class="widget-item-controls">' +
        '<input type="text" placeholder="' + t('widget.text.ph') + '" value="' + escapeAttr(inst.label) + '" data-widget-field="label" data-row="' + rowIndex + '" data-idx="' + i + '">' +
        '</div>';
    }
    html += '<div class="widget-item-move">' +
      '<button type="button" class="small secondary" data-move-widget="up" data-row="' + rowIndex + '" data-idx="' + i + '"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
      '<button type="button" class="small secondary" data-move-widget="down" data-row="' + rowIndex + '" data-idx="' + i + '"' + (i === row.length - 1 ? ' disabled' : '') + '>▼</button>' +
      '<button type="button" class="small secondary" data-move-row data-row="' + rowIndex + '" data-idx="' + i + '">' + t('widget.otherRow') + '</button>' +
      '</div>';
    if (status) {
      html += '<p class="source-status ' + (status.configured ? 'ok' : 'missing') + '"' +
        (status.configured ? '' : ' data-scroll-card="' + status.firstMissing + '"') + '>' + escapeHtml(status.text) + '</p>';
    }
    html += '</div>';
  });
  if (row.length === 0) html += '<p class="empty">' + t('widget.none') + '</p>';
  html += '</div>';
  html += '<button type="button" class="secondary small" data-add-widget data-row="' + rowIndex + '">' + t('widget.add') + '</button>';
  return html;
}

// Палитра «+ виджет»: для metric/text перед добавлением просит слот/подпись
// (paletteSubType), для остальных типов добавляет сразу с размером по
// умолчанию из каталога.
function renderPalette(rowIndex) {
  if (state.paletteRow !== rowIndex) return '';
  var html = '<div class="palette">';
  if (state.paletteSubType && state.paletteSubType.row === rowIndex) {
    var st = state.paletteSubType;
    html += '<div class="add-form">';
    if (st.type === 'metric') {
      html += '<select id="palette-slot">' + slotOptionsHtml(st.slot) + '</select>';
    }
    html += '<input type="text" id="palette-label" placeholder="' + t('widget.label.ph') + '" value="' + escapeAttr(st.label) + '">';
    html += '<div class="actions"><button type="button" id="palette-confirm">' + t('btn.add') + '</button><button type="button" class="secondary" id="palette-cancel">' + t('btn.cancel') + '</button></div>';
    html += '</div>';
  } else if (state.widgetsCatalog.length === 0) {
    html += '<p class="empty">' + t('palette.unavailable') + '</p>';
  } else {
    state.widgetsCatalog.forEach(function (w) {
      html += '<div class="row"><span class="label">' + escapeHtml(typeTitle(w.type, w)) + '</span>' +
        '<button type="button" class="small" data-palette-add="' + w.type + '" data-row="' + rowIndex + '">' + t('palette.add') + '</button></div>';
    });
  }
  html += '<button type="button" class="secondary small full" data-palette-close>' + t('palette.close') + '</button>';
  html += '</div>';
  return html;
}

function handleAddPaletteType(type, row) {
  var spec = state.widgetsByType[type];
  if (type === 'metric' || type === 'text') {
    state.paletteSubType = { type: type, row: row, slot: '', label: '' };
    renderDashboards();
    return;
  }
  pushWidgetInstance(row, { type: type, size: spec ? spec.default_size : 'flex', divider: false, slot: '', label: '' });
  state.paletteRow = null;
  renderDashboards();
}

function confirmPaletteSubType() {
  var st = state.paletteSubType;
  if (!st) return;
  if (st.type === 'metric' && !st.slot) {
    setStatus(t('palette.pickSlot'));
    return;
  }
  var spec = state.widgetsByType[st.type];
  pushWidgetInstance(st.row, { type: st.type, size: spec ? spec.default_size : 'S', divider: false, slot: st.slot, label: st.label });
  state.paletteSubType = null;
  state.paletteRow = null;
  renderDashboards();
}

function renderDashboards() {
  var box = el('dashboards-box');
  if (!state.dashboardsSupported) {
    box.innerHTML = '<p class="empty">' + t('dash.unsupported') + '</p>';
    drawPreview();
    return;
  }
  var tabsHtml = '<div class="tabs">';
  state.dashboards.forEach(function (d, i) {
    tabsHtml += '<button type="button" class="tab-btn' + (i === state.currentTab ? ' active' : '') + '" data-tab="' + i + '">' +
      escapeHtml(d.name || t('dash.defaultName', i + 1)) + '</button>';
  });
  tabsHtml += '</div>';

  var dash = state.dashboards[state.currentTab];
  var editorHtml = '';
  editorHtml += '<label>' + t('dash.name') + '<input type="text" id="dash-name" value="' + escapeAttr(dash.name) + '"></label>';
  editorHtml += '<label class="checkbox-row"><input type="radio" name="active-dashboard" id="dash-active-radio"' +
    (state.activeDashboard === state.currentTab ? ' checked' : '') + '><span>' + t('dash.active') + '</span></label>';
  editorHtml += '<div class="dash-row"><h4>' + t('dash.row.top') + '</h4>' + renderRow(dash, 0) + renderPalette(0) + '</div>';
  editorHtml += '<div class="dash-row"><h4>' + t('dash.row.bottom') + '</h4>' + renderRow(dash, 1) + renderPalette(1) + '</div>';

  box.innerHTML = tabsHtml + editorHtml;
  drawPreview();
}

// ── предпросмотр: canvas 800×480, то же правило ряда, что у прошивки ──

function drawWidgetBox(ctx, x, y, w, h, inst) {
  var configured = isInstanceConfigured(inst);
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x, y, w, h);
  if (!configured) fillHatch(ctx, x, y, w, h);
  ctx.fillStyle = '#1a1a17';
  ctx.font = '600 13px -apple-system, sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText(widgetTitle(inst), x + 6, y + 6);
  ctx.restore();
  ctx.strokeStyle = '#dcdad2';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, Math.max(0, w - 1), Math.max(0, h - 1));
}

// Виджет без настроенного источника — штриховкой, а не пустотой: место в
// раскладке видно сразу, без наведения на бейдж.
function fillHatch(ctx, x, y, w, h) {
  ctx.strokeStyle = '#dcdad2';
  ctx.lineWidth = 1;
  var step = 10;
  for (var d = -h; d < w; d += step) {
    ctx.beginPath();
    ctx.moveTo(x + d, y + h);
    ctx.lineTo(x + d + h, y);
    ctx.stroke();
  }
}

function drawPreviewRow(ctx, row, left, right, y0, y1, gap) {
  var n = row.length;
  if (n === 0) return;
  var totalW = right - left;
  var avail = totalW - gap * (n - 1);
  var flexCount = 0;
  row.forEach(function (w) { if (w.size === 'flex') flexCount++; });
  var widths;
  var fixedSum = 0;
  row.forEach(function (w) { if (w.size !== 'flex') fixedSum += widgetPxWidth(w.size); });
  // Переполнение ряда (например три M) — прошивка делит ряд поровну между
  // видимыми (layout.cpp, layout_row); предпросмотр повторяет то же правило,
  // а не подгоняет картинку клампом, которого на устройстве нет.
  var overflow = fixedSum + flexCount * 120 > avail;
  if (flexCount > 0 && !overflow) {
    var flexW = (avail - fixedSum) / flexCount;
    widths = row.map(function (w) { return w.size === 'flex' ? flexW : widgetPxWidth(w.size); });
  } else {
    var each = avail / n;
    widths = row.map(function () { return each; });
  }
  var x = left;
  row.forEach(function (w, i) {
    if (i > 0 && w.divider) {
      var lineX = x - gap / 2;
      ctx.fillStyle = '#dcdad2';
      ctx.fillRect(lineX - 1, y0, 2, y1 - y0);
    }
    drawWidgetBox(ctx, x, y0, widths[i], y1 - y0, w);
    x += widths[i] + gap;
  });
}

function drawPreview() {
  var canvas = el('preview-canvas');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#f4f3ef';
  ctx.fillRect(0, 0, W, H);

  var headerH = 40, margin = 12, gap = 12, lineW = 2;
  ctx.fillStyle = '#1a1a17';
  ctx.fillRect(0, 0, W, headerH);

  var dash = currentDashboard();
  ctx.fillStyle = '#ffffff';
  ctx.font = '600 18px -apple-system, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText(dash ? (dash.name || t('preview.unnamed')) : t('preview.nodata'), margin, headerH / 2);

  if (!dash) return;

  var left = margin, right = W - margin, top = headerH + margin, bottom = H - margin;
  var rows = dash.rows;
  var nonEmpty = [rows[0].length > 0, rows[1].length > 0];
  var totalH = bottom - top;
  var rects = [null, null];
  if (nonEmpty[0] && nonEmpty[1]) {
    var rh = (totalH - gap * 2 - lineW) / 2;
    rects[0] = { y0: top, y1: top + rh };
    var lineY = rects[0].y1 + gap;
    ctx.fillStyle = '#dcdad2';
    ctx.fillRect(left, lineY, right - left, lineW);
    rects[1] = { y0: lineY + lineW + gap, y1: bottom };
  } else if (nonEmpty[0]) {
    rects[0] = { y0: top, y1: bottom };
  } else if (nonEmpty[1]) {
    rects[1] = { y0: top, y1: bottom };
  }

  rows.forEach(function (row, ri) {
    if (!rects[ri]) return;
    drawPreviewRow(ctx, row, left, right, rects[ri].y0, rects[ri].y1, gap);
  });
}

// Сам скан выполняет главный цикл устройства, а не задача веб-сервера
// (блокирующий Wi-Fi скан валил её по сторожевому таймеру). /api/scan
// отвечает немедленно тем, что уже есть в кеше, и признаком scanning — пока
// он true, результат может быть пустым или устаревшим, спрашиваем ещё раз
// через полторы секунды.
function pollScan() {
  fetchJSON('/api/scan').then(function (res) {
    renderScanList(res.networks || []);
    if (res.scanning) {
      setStatus(t('scan.scanning'));
      setTimeout(pollScan, 1500);
    } else {
      setStatus('');
    }
  }).catch(function (err) { setStatus(t('scan.failed', err.message)); });
}

function showAddForm(ssid, secure) {
  pendingSsid = ssid;
  pendingSecure = secure;
  el('add-ssid-label').textContent = t('net.passwordFor', ssid);
  el('add-password').value = '';
  el('add-password').hidden = !secure;
  el('add-network-form').hidden = false;
}

function confirmAddNetwork() {
  if (!pendingSsid) return;
  var password = pendingSecure ? el('add-password').value : '';
  var existing = state.networks.find(function (n) { return n.ssid === pendingSsid; });
  if (existing) {
    existing.password = password;
    existing.password_set = existing.password_set || password.length > 0;
  } else {
    state.networks.push({ ssid: pendingSsid, password: password, password_set: password.length > 0 });
  }
  el('add-network-form').hidden = true;
  pendingSsid = null;
  renderNetworks();
}

// ── источники: добавление/удаление датчиков, строк map, источников ──

function confirmAddSensor() {
  var sel = el('add-sensor-slot');
  var slot = sel.value;
  if (slot === '__custom') slot = (el('add-sensor-custom').value || '').trim();
  if (!slot) return;
  var home = conn('home');
  if (!home) return;
  home.map.push({
    slot: slot, source: '', ttl: (slot === 'co2' || slot === 'tvoc') ? 600 : 3600,
    delta_source: '', delta_is_previous: false, has_history: (slot === 'co2' || slot === 'tvoc'),
    history_source: '', history_item: ''
  });
  state.addSensorOpen = false;
  renderSources();
}

function removeSensor(idx) {
  var home = conn('home');
  if (!home) return;
  home.map.splice(idx, 1);
  renderSources();
}

function addMapRow(connId) {
  var c = conn(connId);
  if (!c) return;
  c.map.push({ slot: '', source: '', ttl: 300, delta_source: '', delta_is_previous: false, has_history: false, history_source: '', history_item: '' });
  renderSources();
}

function removeMapRow(connId, idx) {
  var c = conn(connId);
  if (!c) return;
  c.map.splice(idx, 1);
  renderSources();
}

function addCustomConnector() {
  var stamp = Date.now().toString(36).slice(-4);
  var id = 'custom-' + stamp;
  state.connectors.push({
    id: id, kind: 'http', url: '', interval: 300,
    token: '', token_set: false, refresh_token: '', refresh_token_set: false,
    username: '', username_set: false, insecure: false, map: []
  });
  state.connectorOrig[id] = { url: '', insecure: false };
  renderSources();
}

function removeConnector(id) {
  var idx = state.connectors.findIndex(function (c) { return c.id === id; });
  if (idx >= 0) state.connectors.splice(idx, 1);
  delete state.connectorOrig[id];
  renderSources();
  renderDashboards();  // виджеты могли ссылаться на слоты удалённого источника — бейджи надо пересчитать
}

function loadWidgetsCatalog() {
  return fetchJSON('/api/widgets').then(function (data) {
    state.widgetsCatalog = Array.isArray(data) ? data : [];
    state.widgetsByType = {};
    state.widgetsCatalog.forEach(function (w) { state.widgetsByType[w.type] = w; });
  }).catch(function () {
    state.widgetsCatalog = [];
    state.widgetsByType = {};
  });
}

function loadConfig() {
  return fetchJSON('/api/config').then(function (cfg) {
    state.device_name = cfg.device_name || '';
    state.timezone_minutes = cfg.timezone_minutes || 0;
    state.city = cfg.city || '';
    state.city_resolved = cfg.city_resolved || '';
    state.city_lat = cfg.city_lat || 0;
    state.city_lon = cfg.city_lon || 0;
    state.lang = cfg.lang === 'ru' ? 'ru' : 'en';
    state.networks = (cfg.networks || []).map(function (n) {
      return { ssid: n.ssid, password: '', password_set: !!n.password_set };
    });
    state.connectors = (cfg.connectors || []).map(function (c) {
      return {
        id: c.id, kind: c.kind || 'http', url: c.url || '',
        interval: c.interval || 300, token: '', token_set: !!c.token_set,
        refresh_token: '', refresh_token_set: !!c.refresh_token_set,
        username: '', username_set: !!c.username_set,
        insecure: !!c.insecure,
        // Мутируем эти же объекты, не пересобираем — в них есть has_history,
        // delta_source, delta_is_previous, history_source, history_item, они
        // должны уйти назад ровно так, как пришли.
        map: c.map || []
      };
    });
    ensureFactoryConnectors();
    state.connectorOrig = {};
    state.connectors.forEach(function (c) { state.connectorOrig[c.id] = { url: c.url, insecure: c.insecure }; });

    if (Array.isArray(cfg.dashboards)) {
      state.dashboardsSupported = true;
      state.dashboards = cfg.dashboards.map(function (d) {
        return {
          name: d.name || '',
          rows: [0, 1].map(function (r) {
            return ((d.rows && d.rows[r]) || []).map(function (w) {
              return { type: w.type, size: w.size || 'flex', divider: !!w.divider, slot: w.slot || '', label: w.label || '' };
            });
          })
        };
      });
      state.activeDashboard = cfg.active_dashboard || 0;
      if (state.currentTab >= state.dashboards.length) state.currentTab = 0;
    } else {
      state.dashboardsSupported = false;
      state.dashboards = [];
    }

    el('device-name').value = state.device_name;
    el('lang').value = state.lang;
    state.loaded = true;
    applyLang();
    el('save-btn').disabled = false;
  }).catch(function (e) {
    // Настройки не пришли — форму НЕ показываем как редактируемую: пустая
    // форма, сохранённая по привычке, ушла бы на устройство как «сетей нет,
    // адреса пустые» и стёрла бы сети и секреты (ревью 2026-09-21). Кнопка
    // «Сохранить» заблокирована до удачной загрузки.
    state.loaded = false;
    el('save-btn').disabled = true;
    setStatus(t('status.loadFailed', e.message));
  });
}

function pollStatus() {
  fetchJSON('/api/status').then(function (data) {
    state.status = data;
    updateStatusLines();
  }).catch(function () { /* тихо: устройство недоступно, карточки уже показывают «данных ещё нет» */ });
  setTimeout(pollStatus, 10000);
}

// ── события ──

document.addEventListener('click', function (e) {
  var tgt = e.target;

  if (tgt.id === 'scan-btn') {
    setStatus(t('scan.scanning'));
    pollScan();
  }
  if (tgt.dataset && tgt.dataset.pickSsid !== undefined) {
    showAddForm(tgt.dataset.pickSsid, tgt.dataset.secure === '1');
  }
  if (tgt.id === 'add-network-confirm') confirmAddNetwork();
  if (tgt.id === 'add-network-cancel') { el('add-network-form').hidden = true; pendingSsid = null; }
  if (tgt.dataset && tgt.dataset.removeNetwork !== undefined) {
    state.networks.splice(Number(tgt.dataset.removeNetwork), 1);
    renderNetworks();
  }

  // Экраны
  if (tgt.dataset && tgt.dataset.tab !== undefined) {
    state.currentTab = Number(tgt.dataset.tab);
    state.paletteRow = null;
    state.paletteSubType = null;
    renderDashboards();
  }
  if (tgt.id === 'dash-active-radio') { state.activeDashboard = state.currentTab; }
  if (tgt.dataset && tgt.dataset.addWidget !== undefined) {
    var r = Number(tgt.dataset.row);
    state.paletteRow = (state.paletteRow === r) ? null : r;
    state.paletteSubType = null;
    renderDashboards();
  }
  if (tgt.dataset && tgt.dataset.paletteClose !== undefined) {
    state.paletteRow = null;
    state.paletteSubType = null;
    renderDashboards();
  }
  if (tgt.dataset && tgt.dataset.paletteAdd !== undefined) {
    handleAddPaletteType(tgt.dataset.paletteAdd, Number(tgt.dataset.row));
  }
  if (tgt.id === 'palette-confirm') confirmPaletteSubType();
  if (tgt.id === 'palette-cancel') { state.paletteSubType = null; renderDashboards(); }
  if (tgt.dataset && tgt.dataset.moveWidget !== undefined) {
    moveWidget(Number(tgt.dataset.row), Number(tgt.dataset.idx), tgt.dataset.moveWidget);
    renderDashboards();
  }
  if (tgt.dataset && tgt.dataset.moveRow !== undefined) {
    moveToOtherRow(Number(tgt.dataset.row), Number(tgt.dataset.idx));
    renderDashboards();
  }
  if (tgt.dataset && tgt.dataset.removeWidget !== undefined) {
    removeWidget(Number(tgt.dataset.row), Number(tgt.dataset.idx));
    renderDashboards();
  }
  if (tgt.classList && tgt.classList.contains('source-status') && tgt.dataset.scrollCard) {
    var target = document.getElementById('source-card-' + tgt.dataset.scrollCard);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Источники
  if (tgt.id === 'add-sensor-btn') { state.addSensorOpen = true; renderSources(); }
  if (tgt.id === 'add-sensor-cancel') { state.addSensorOpen = false; renderSources(); }
  if (tgt.id === 'add-sensor-confirm') confirmAddSensor();
  if (tgt.dataset && tgt.dataset.removeSensor !== undefined) removeSensor(Number(tgt.dataset.sensorIdx));
  if (tgt.dataset && tgt.dataset.addMap !== undefined) addMapRow(tgt.dataset.connId);
  if (tgt.dataset && tgt.dataset.removeMap !== undefined) removeMapRow(tgt.dataset.connId, Number(tgt.dataset.mapIdx));
  if (tgt.id === 'add-custom-connector') addCustomConnector();
  if (tgt.dataset && tgt.dataset.removeConnector !== undefined) removeConnector(tgt.dataset.removeConnector);

  if (tgt.id === 'save-btn') save();
  if (tgt.id === 'reboot-btn') reboot();
});

function handleFieldChange(e) {
  var tgt = e.target;
  if (!tgt.dataset) return;

  if (tgt.dataset.connField !== undefined && tgt.dataset.connId !== undefined) {
    var c = conn(tgt.dataset.connId);
    if (!c) return;
    var field = tgt.dataset.connField;
    if (field === 'interval') c.interval = Number(tgt.value) || 300;
    else if (field === 'insecure') c.insecure = tgt.checked;
    else c[field] = tgt.value;
    if (field === 'url' || field === 'insecure') updateChangedHint(tgt.dataset.connId);
    return;
  }

  if (tgt.dataset.mapField !== undefined && tgt.dataset.connId !== undefined && tgt.dataset.mapIdx !== undefined) {
    var c2 = conn(tgt.dataset.connId);
    if (!c2) return;
    var m = c2.map[Number(tgt.dataset.mapIdx)];
    if (!m) return;
    m[tgt.dataset.mapField] = tgt.value;
    return;
  }

  if (tgt.dataset.sensorField !== undefined && tgt.dataset.sensorIdx !== undefined) {
    var home = conn('home');
    if (!home) return;
    var sm = home.map[Number(tgt.dataset.sensorIdx)];
    if (!sm) return;
    sm[tgt.dataset.sensorField] = tgt.value;
    return;
  }

  if (tgt.dataset.widgetField !== undefined) {
    var dash = currentDashboard();
    if (!dash) return;
    var inst = dash.rows[Number(tgt.dataset.row)][Number(tgt.dataset.idx)];
    if (!inst) return;
    var wfield = tgt.dataset.widgetField;
    if (wfield === 'divider') inst.divider = tgt.checked;
    else inst[wfield] = tgt.value;
    if (wfield === 'slot') renderDashboards();  // бейдж источника зависит от слота
    else drawPreview();
    return;
  }

  if (tgt.id === 'lang') {
    state.lang = tgt.value === 'ru' ? 'ru' : 'en';
    applyLang();
    return;
  }

  if (tgt.id === 'dash-name') {
    var d = currentDashboard();
    if (d) d.name = tgt.value;
    drawPreview();
    return;
  }

  if (tgt.id === 'palette-slot' && state.paletteSubType) { state.paletteSubType.slot = tgt.value; return; }
  if (tgt.id === 'palette-label' && state.paletteSubType) { state.paletteSubType.label = tgt.value; return; }

  if (tgt.id === 'add-sensor-slot') { el('add-sensor-custom').hidden = tgt.value !== '__custom'; return; }

  if (tgt.id === 'device-city') { state.city = tgt.value; updateCityHint(); return; }
  if (tgt.id === 'device-name') { updateDeviceNameHint(tgt.value); return; }
}
// 'change' — для чекбоксов и select (не все браузеры шлют 'input' по клику
// на checkbox одинаково надёжно), 'input' — для текстовых полей.
document.addEventListener('input', handleFieldChange);
document.addEventListener('change', handleFieldChange);

// Запись настроек разрешена из любой сети (docs/decisions.md, п.8) — гейта
// «только из точки доступа» на странице больше нет, кнопки всегда активны.
function save() {
  if (!state.loaded) {
    setStatus(t('status.notLoaded'));
    return;
  }
  var payload = {
    device_name: el('device-name').value || 'tablo-setup',
    timezone_minutes: state.timezone_minutes,
    city: state.city,
    lang: state.lang,
    networks: state.networks.map(function (n) { return { ssid: n.ssid, password: n.password || '' }; }),
    connectors: state.connectors.filter(function (c) { return c.id; }).map(function (c) {
      return {
        id: c.id, kind: c.kind, url: c.url, interval: c.interval,
        token: c.token || '', refresh_token: c.refresh_token || '', username: c.username || '',
        insecure: !!c.insecure, map: c.map || []
      };
    })
  };

  if (state.dashboardsSupported) {
    payload.dashboards = state.dashboards.map(function (d) {
      return { name: d.name || '', rows: d.rows.map(function (row) { return row.map(serializeInstance); }) };
    });
    payload.active_dashboard = state.activeDashboard;
  }

  setStatus(t('status.saving'));
  fetchJSON('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function () {
    setStatus(t('status.saved'));
    return loadWidgetsCatalog().then(function () { return loadConfig(); });
  }).catch(function (err) { setStatus(t('status.saveFailed', err.message)); });
}

// slot/label — только непустые, divider — только true (экономия NVS, то же
// правило, что у to_json дашбордов в прошивке).
function serializeInstance(inst) {
  var o = { type: inst.type, size: inst.size };
  if (inst.divider) o.divider = true;
  if (inst.slot) o.slot = inst.slot;
  if (inst.label) o.label = inst.label;
  return o;
}

function reboot() {
  if (!confirm(t('reboot.confirm'))) return;
  setStatus(t('status.rebooting'));
  // JSON-тело обязательно: устройство принимает reboot только как
  // application/json — иначе любая чужая страница могла бы перезагружать его
  // простой формой (CSRF), пока страница настройки открыта из той же сети.
  fetch('/api/reboot', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
    .catch(function () {});
}

// Применяет state.lang: статическая разметка (data-i18n*), <html lang>, <title>,
// затем перерисовка всего, что строится из JS. Вызывается при загрузке
// конфига и при смене селекта языка.
function applyLang() {
  document.documentElement.lang = state.lang;
  document.title = t('title');
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (n) {
    n.textContent = t(n.getAttribute('data-i18n'));
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-placeholder]'), function (n) {
    n.setAttribute('placeholder', t(n.getAttribute('data-i18n-placeholder')));
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-title]'), function (n) {
    n.setAttribute('title', t(n.getAttribute('data-i18n-title')));
  });
  if (pendingSsid) el('add-ssid-label').textContent = t('net.passwordFor', pendingSsid);
  if (state.scanResults) renderScanList(state.scanResults);
  // Динамические блоки строятся из state, который есть только после загрузки
  // конфига (до неё в них «загрузка…» и пустые заглушки).
  if (state.loaded) {
    updateDeviceNameHint(el('device-name').value);
    renderNetworks();
    renderSources();
    renderDashboards();
  }
}

function boot() {
  applyLang();
  loadWidgetsCatalog().then(function () { return loadConfig(); });
  pollStatus();
}
boot();
</script>
</body>
</html>
